<svg width="180" height="180" viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg">
    <!-- Square icon background -->
    <rect x="20" y="20" width="140" height="140" rx="20" fill="white" stroke="#E8E8E8" stroke-width="3"/>
    
    <!-- Four layers with labels -->
    <rect x="40" y="48" width="100" height="16" rx="8" fill="#E74C3C" opacity="0.9"/>
    <text x="50" y="60" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">S</text>
    
    <rect x="40" y="72" width="100" height="16" rx="8" fill="#3498DB" opacity="0.9"/>
    <text x="50" y="84" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">A</text>
    
    <rect x="40" y="96" width="100" height="16" rx="8" fill="#2ECC71" opacity="0.9"/>
    <text x="50" y="108" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">T</text>
    
    <rect x="40" y="120" width="100" height="16" rx="8" fill="#9B59B6" opacity="0.9"/>
    <text x="50" y="132" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">B</text>
    
    <!-- Quarter note -->
