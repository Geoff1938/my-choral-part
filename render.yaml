services:
  - type: web
    name: my-choral-part
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Activity database on the persistent disk (backups go in /var/data/backups)
      - key: DATABASE_PATH
        value: /var/data/activity.db
      # MIDI index files (rebuilt nightly) - seeded from the repo's data/ on first start
      - key: DATA_DIR
        value: /var/data
      # JSON object of admin email: password - set in the Render dashboard,
      # never committed (this repo is public)
      - key: ADMIN_USERS
        sync: false
    disk:
      name: choral-data
      mountPath: /var/data
      sizeGB: 1
