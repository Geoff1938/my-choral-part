<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learn Choral Music</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎵 Learn Choral Music</h1>
            <p>Find music and rehearse your part on any device</p>
        </header>

        <!-- Tab Navigation -->
        <nav class="tab-nav">
            <button class="tab-button active" data-tab="find-music" title="Search for composers and their works">Find Music</button>
            <button class="tab-button" data-tab="play-music" title="Play and practice with selected music">Play Music</button>
        </nav>

        <main>
            <!-- Find Music Tab -->
            <div class="tab-content active" id="find-music-tab">
                <!-- Composer Search -->
                <div class="input-group">
                    <label for="composer-search">Search Composer:</label>
                    <input
                        type="text"
                        id="composer-search"
                        placeholder="Type to search composers..."
                        aria-label="Search for composer"
                        title="Start typing a composer's name to search (e.g., 'Allegri', 'Bach', 'Mozart')"
                    >
                </div>
                <div id="composer-results" class="search-results"></div>

                <!-- Works List -->
                <div id="works-container" class="works-container" style="display: none;">
                    <label>Select Work:</label>
                    <div id="works-list" class="works-list"></div>
                </div>

                <div id="loading-status" class="status-message"></div>
            </div>

            <!-- Play Music Tab -->
            <div class="tab-content" id="play-music-tab">
                <!-- Work Info and Shareable URL -->
                <div class="work-info-section">
                    <div class="work-title">
                        <h2 id="current-work-display">No work selected</h2>
                    </div>
                    <div class="shareable-url-section" id="shareable-url-section" style="display: none;">
                        <div class="url-copy-container">
                            <input type="text" id="shareable-url" readonly aria-label="Shareable URL" title="Share this URL with others to let them practice the same piece">
                            <button id="copy-url-btn" class="btn btn-small btn-icon" title="Copy URL to clipboard">📋</button>
                        </div>
                    </div>
                </div>

                <!-- Selection Controls -->
                <div class="selection-controls">

                    <!-- Recent Works Dropdown -->
                    <div class="control-group" id="recent-works-dropdown" style="display: none;">
                        <label for="recent-works-select">Recent Works:</label>
                        <select id="recent-works-select" aria-label="Select from recent works" title="Quickly switch to a recently practiced work">
                            <option value="">Choose a recent work...</option>
                        </select>
                    </div>

                    <!-- Voice Part Selection -->
                    <div class="control-group">
                        <label for="voice-part" title="Select which voice part you sing">My Voice Part:</label>
                        <select id="voice-part" aria-label="Select your voice part" title="Select your voice part to adjust the balance - your part will be highlighted">
                            <option value="soprano">Soprano</option>
                            <option value="alto">Alto</option>
                            <option value="tenor">Tenor</option>
                            <option value="bass">Bass</option>
                        </select>
                    </div>

                    <!-- Channel Selector (when multiple channels match voice part) -->
                    <div class="control-group" id="channel-selector-container" style="display: none;">
                        <label for="channel-selector" title="Select which specific channel to highlight">Which one:</label>
                        <select id="channel-selector" aria-label="Select specific channel" title="When multiple parts match your voice type, choose which one is yours">
                            <!-- Dynamically populated -->
                        </select>
                    </div>
                </div>

                <!-- Playback Controls Section -->
                <section class="controls-section" id="controls-section">
                    <div class="playback-info">
                        <select id="section-select" class="section-select-main" title="Select which section/movement of the work to practice">
                            <option value="">Choose a section...</option>
                        </select>
                    </div>

                    <!-- Main Playback Controls -->
                    <div class="main-controls">
                        <button id="play-btn" class="btn btn-control" aria-label="Play" title="Start playback">
                            <span class="icon">▶️</span> Play
                        </button>
                        <button id="pause-btn" class="btn btn-control" aria-label="Pause" style="display: none;" title="Pause playback">
                            <span class="icon">⏸️</span> Pause
                        </button>
                        <button id="stop-btn" class="btn btn-control" aria-label="Stop" title="Stop playback and return to beginning">
                            <span class="icon">⏹️</span> Stop
                        </button>
                    </div>

                    <!-- Seek Controls -->
                    <div class="seek-controls">
                        <button id="backward-btn" class="btn btn-seek" aria-label="Go back 10 seconds" title="Skip backward 10 seconds">
                            <span class="icon">⏪</span> -10s
                        </button>
                        <button id="forward-btn" class="btn btn-seek" aria-label="Go forward 10 seconds" title="Skip forward 10 seconds">
                            <span class="icon">⏩</span> +10s
                        </button>
                    </div>

                    <!-- Progress Bar -->
                    <div class="progress-container">
                        <div class="progress-header">
                            <span id="current-time">0:00</span>
                        </div>
                        <div class="progress-time-labels">
                            <span>0:00</span>
                            <span id="progress-duration">0:00</span>
                        </div>
                        <input
                            type="range"
                            id="progress-bar"
                            min="0"
                            max="100"
                            value="0"
                            class="progress-bar"
                            aria-label="Playback progress"
                            title="Drag to jump to any point in the song"
                        >
                    </div>

                    <!-- Loop Point Controls -->
                    <div class="loop-controls">
                        <label title="Set a section of the song to loop repeatedly for focused practice">Loop Section: <span id="loop-range-display">0:00 - 0:00</span></label>
                        <div class="loop-slider-container">
                            <input type="range" id="loop-start-slider" min="0" max="100" value="0" class="loop-slider" aria-label="Loop start position" title="Set where the loop begins - playback will restart from this point">
                            <input type="range" id="loop-end-slider" min="0" max="100" value="100" class="loop-slider" aria-label="Loop end position" title="Set where the loop ends - playback will jump back to loop start at this point">
                            <div class="loop-track">
                                <div id="loop-highlight" class="loop-highlight"></div>
                            </div>
                        </div>
                    </div>

                    <!-- Tempo Control -->
                    <div class="tempo-control">
                        <label for="tempo-slider" title="Adjust playback speed - slower for learning, faster as you improve">Tempo: <span id="tempo-value">100</span>%</label>
                        <div class="tempo-buttons">
                            <button id="tempo-down" class="btn btn-small" aria-label="Decrease tempo" title="Slow down the music by 5% to make it easier to learn">
                                <span class="icon">🐢</span> Slower
                            </button>
                            <div class="tempo-slider-container">
                                <div class="tempo-labels">
                                    <span class="tempo-label-left">60%</span>
                                    <span class="tempo-label-center">100%</span>
                                    <span class="tempo-label-right">120%</span>
                                </div>
                                <input
                                    type="range"
                                    id="tempo-slider"
                                    min="60"
                                    max="120"
                                    value="100"
                                    step="5"
                                    aria-label="Tempo slider"
                                    title="Adjust playback speed (60%=very slow for learning, 100%=original tempo, 120%=faster)"
                                >
                            </div>
                            <button id="tempo-up" class="btn btn-small" aria-label="Increase tempo" title="Speed up the music by 5% for a challenge">
                                <span class="icon">🐇</span> Faster
                            </button>
                        </div>
                    </div>

                    <!-- Master Volume Control -->
                    <div class="master-volume-control">
                        <div class="volume-control-item">
                            <label for="master-volume" title="Control the overall volume for all parts together">Master Volume: <span id="master-volume-value">100</span>%</label>
                            <input
                                type="range"
                                id="master-volume"
                                min="0"
                                max="100"
                                value="100"
                                step="5"
                                class="volume-slider"
                                aria-label="Master volume"
                                title="Control overall volume - affects all parts equally (0%=silent, 100%=full volume)"
                            >
                        </div>
                    </div>

                    <!-- Balance Control -->
                    <div class="balance-control">
                        <div class="volume-control-item">
                            <label for="balance-slider" title="Adjust the balance between your part and the other parts">My Part Balance: <span id="balance-value">0</span></label>
                            <div class="balance-labels">
                                <span>Others Louder</span>
                                <span>Equal</span>
                                <span>My Part Louder</span>
                            </div>
                            <input
                                type="range"
                                id="balance-slider"
                                min="-100"
                                max="100"
                                value="0"
                                step="5"
                                class="volume-slider"
                                aria-label="Balance between your part and others"
                                title="Balance your part vs. others - left=hear others better, center=equal, right=hear your part better"
                            >
                        </div>
                    </div>
                </section>
            </div>
        </main>

    </div>

    <!-- Load Tone.js from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/tone@14.8.49/build/Tone.js"></script>
    <!-- Load MIDI file parser -->
    <script src="https://cdn.jsdelivr.net/npm/@tonejs/midi@2.0.28/build/Midi.js"></script>
    <!-- Load SoundFont player for realistic instruments -->
    <script src="https://cdn.jsdelivr.net/npm/soundfont-player@0.12.0/dist/soundfont-player.min.js"></script>
    <!-- Our app logic -->
    <script src="app.js"></script>
</body>
</html>
